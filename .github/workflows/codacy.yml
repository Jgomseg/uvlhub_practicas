name: Codacy CI

# ─────────────────────────────────────────────────────────────
# Integración Continua (CI) para uvlhub con análisis de calidad
# en Codacy. Incluye las 3 modificaciones de la Práctica 1:
#   1) Comprobar si hay nuevas versiones de las dependencias
#   2) Verificar compatibilidad con Python 3.13 y 3.14 (matriz)
#   3) Análisis de seguridad de dependencias con pip-audit
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  codacy:
    runs-on: ubuntu-24.04

    # ── Modificación 2 ───────────────────────────────────────
    # Se ejecuta el job para cada versión de Python, de modo que
    # se verifica la compatibilidad del código con 3.13 y 3.14.
    # fail-fast: false → si una versión falla, la otra sigue
    # ejecutándose y obtenemos el informe de ambas.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']

    services:
      mariadb:
        image: mariadb:12.0.2
        env:
          MARIADB_ROOT_PASSWORD: uvlhub_root_password
          MARIADB_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root -p$MARIADB_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./rosemary

      # ── Modificación 1 ─────────────────────────────────────
      # Comprueba si hay nuevas versiones disponibles de las
      # dependencias instaladas. No rompe la CI (es informativo):
      # 'pip list --outdated' lista lo que se podría actualizar.
      - name: Check for outdated dependencies
        run: |
          echo "==> Dependencias con nuevas versiones disponibles:"
          pip list --outdated --format=columns

      # ── Modificación 3 ─────────────────────────────────────
      # Análisis de seguridad de las dependencias instaladas.
      # pip-audit consulta la base de datos de vulnerabilidades
      # (PyPI Advisory / OSV) y reporta CVEs conocidas.
      # continue-on-error: true → surfacea las vulnerabilidades
      # sin tumbar el pipeline. Quítalo si quieres que sea un
      # "gate" estricto que falle ante cualquier vulnerabilidad.
      - name: Security audit of dependencies (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit --progress-spinner=off

      - name: Run tests with coverage
        run: |
          coverage run -m pytest app/features/ --ignore-glob='*selenium*'
          coverage xml
        env:
          FLASK_ENV: testing
          MARIADB_HOSTNAME: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_TEST_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password

      # Solo se sube la cobertura una vez (con la versión
      # principal) para no enviar informes duplicados a Codacy.
      - name: Upload coverage to Codacy
        if: matrix.python-version == '3.13'
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
